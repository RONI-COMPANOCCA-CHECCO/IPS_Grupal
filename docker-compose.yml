version: '3.9'

services:
  backend:
  build: ./proyecto
  container_name: django-backend
  ports:
    - "8000:8000"
  volumes:
    - ./proyecto:/app
  working_dir: /app/viviendas   # <- nuevo
  env_file:
    - ./proyecto/.env
  depends_on:
    - db


  frontend:
    build: ./react-app
    container_name: react-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
